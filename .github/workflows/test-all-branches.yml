# Applies a test matrix to any new code pushed to the repo

name: Tests pushes and PRs against multiple Python versions

on:
  push:
    branches: "**"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: "**"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        # One Windows job, so that platform-specific breakage is caught here
        # rather than by a contributor. Issue #80 was exactly this: the csv
        # field size limit overflows a 32-bit C long on Windows, which an
        # ubuntu-only matrix can never see.
        include:
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
      - name: Test with pytest
        run: |
          pytest --cov=nhs_number --cov-branch --cov-report=term --cov-fail-under=100
      - name: Check code formatting with black
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: |
          pip install black
          black --check .
